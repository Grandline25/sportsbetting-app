<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsBet - Clean Betting Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      background: #1e293b;
      padding: 2rem;
      border-bottom: 1px solid #334155;
      text-align: center;
    }
    .header h1 {
      font-size: 2.5rem;
      color: #60a5fa;
      margin-bottom: 0.5rem;
    }
    .header p {
      color: #94a3b8;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 2rem;
    }
    .sports-list, .events-list, .betting-slip {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.5rem;
    }
    .sports-list h2, .events-list h2, .betting-slip h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #f1f5f9;
    }
    .sports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .sport-btn {
      padding: 1rem;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 6px;
      cursor: pointer;
      color: #e2e8f0;
      font-size: 0.9rem;
      text-align: center;
      transition: all 0.3s ease;
    }
    .sport-btn:hover {
      border-color: #60a5fa;
      background: #1a2744;
      transform: translateY(-2px);
    }
    .sport-btn.active {
      background: #60a5fa;
      color: #fff;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.3);
    }
    .events-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 600px;
      overflow-y: auto;
    }
    .event-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 1rem;
      transition: all 0.3s ease;
    }
    .event-card:hover {
      border-color: #60a5fa;
      box-shadow: 0 4px 12px rgba(96, 165, 250, 0.15);
    }
    .event-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .event-header h3 {
      font-size: 1rem;
      color: #f1f5f9;
      flex: 1;
    }
    .event-date {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-left: 1rem;
    }
    .odds-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .odd-btn {
      padding: 0.75rem;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 4px;
      cursor: pointer;
      color: #e2e8f0;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .odd-btn:hover {
      background: #334155;
      border-color: #60a5fa;
      color: #60a5fa;
      transform: scale(1.05);
    }
    .bets-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .bet-item {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #334155;
      font-size: 0.85rem;
    }
    .slip-divider {
      height: 1px;
      background: #334155;
      margin: 1rem 0;
    }
    .slip-summary {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
    }
    .stake-input {
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #f1f5f9;
      margin-bottom: 1rem;
    }
    .place-bet-btn {
      width: 100%;
      padding: 1rem;
      background: #60a5fa;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .place-bet-btn:hover {
      background: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(96, 165, 250, 0.3);
    }
    .empty {
      color: #94a3b8;
      text-align: center;
      padding: 2rem 0;
    }
    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚽ SportsBet</h1>
    <p>Clean. Simple. Sports Betting.</p>
  </div>

  <div class="container">
    <div>
      <div class="sports-list">
        <h2>Sports</h2>
        <div class="sports-grid">
          <button class="sport-btn active" onclick="selectSport('Football')">⚽ Football</button>
          <button class="sport-btn" onclick="selectSport('Basketball')">🏀 Basketball</button>
          <button class="sport-btn" onclick="selectSport('Tennis')">🎾 Tennis</button>
          <button class="sport-btn" onclick="selectSport('Cricket')">🏏 Cricket</button>
        </div>
      </div>

      <div class="events-list">
        <h2>Upcoming Events</h2>
        <div class="events-container" id="events">
          <p class="empty">Loading events...</p>
        </div>
      </div>
    </div>

    <div class="betting-slip">
      <h2>Betting Slip</h2>
      <div id="bets" class="bets-list">
        <p class="empty">Click odds to add bets</p>
      </div>
      <div class="slip-divider"></div>
      <div class="slip-summary">
        <div class="summary-row">
          <span>Selections</span>
          <span id="selections">0</span>
        </div>
        <div class="summary-row">
          <span>Total Odds</span>
          <span id="totalOdds">1.00</span>
        </div>
      </div>
      <input type="number" class="stake-input" id="stake" placeholder="Stake amount" min="0" step="0.01">
      <button class="place-bet-btn" onclick="placeBet()">Place Bet</button>
    </div>
  </div>

  <script>
    let selectedSport = 'Football';
    let selectedBets = [];
    
    const events = {
      'Football': [
        { id: 1, match: 'Manchester United vs Liverpool', date: '2026-04-25 15:00', odds: { home: 2.10, draw: 3.50, away: 3.40 } },
        { id: 2, match: 'Real Madrid vs Barcelona', date: '2026-04-25 20:00', odds: { home: 1.95, draw: 3.60, away: 3.80 } }
      ],
      'Basketball': [
        { id: 3, match: 'Lakers vs Celtics', date: '2026-04-25 22:00', odds: { home: 2.30, away: 1.65 } }
      ],
      'Tennis': [
        { id: 4, match: 'Djokovic vs Alcaraz', date: '2026-04-26 10:00', odds: { home: 1.85, away: 2.10 } }
      ],
      'Cricket': [
        { id: 5, match: 'India vs Australia', date: '2026-04-26 14:00', odds: { home: 2.05, away: 1.75 } }
      ]
    };

    function selectSport(sport) {
      selectedSport = sport;
      document.querySelectorAll('.sport-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      displayEvents();
    }

    function displayEvents() {
      const eventsList = events[selectedSport] || [];
      const html = eventsList.map(e => `
        <div class="event-card">
          <div class="event-header">
            <h3>${e.match}</h3>
            <span class="event-date">${e.date}</span>
          </div>
          <div class="odds-container">
            ${e.odds.home ? `<button class="odd-btn" onclick="addBet('${e.match}', 'Home', ${e.odds.home})">Home<br>${e.odds.home}</button>` : ''}
            ${e.odds.draw ? `<button class="odd-btn" onclick="addBet('${e.match}', 'Draw', ${e.odds.draw})">Draw<br>${e.odds.draw}</button>` : ''}
            ${e.odds.away ? `<button class="odd-btn" onclick="addBet('${e.match}', 'Away', ${e.odds.away})">Away<br>${e.odds.away}</button>` : ''}
          </div>
        </div>
      `).join('');
      document.getElementById('events').innerHTML = html || '<p class="empty">No events available</p>';
    }

    function addBet(match, type, odds) {
      const bet = { id: Date.now(), match, type, odds };
      selectedBets.push(bet);
      updateSlip();
    }

    function removeBet(id) {
      selectedBets = selectedBets.filter(b => b.id !== id);
      updateSlip();
    }

    function updateSlip() {
      const betsHtml = selectedBets.length ? selectedBets.map(b => `
        <div class="bet-item">
          <div>
            <strong>${b.match}</strong><br>
            <small>${b.type}</small>
          </div>
          <div>
            <strong>${b.odds}</strong>
            <button onclick="removeBet(${b.id})" style="margin-left: 0.5rem; background: none; border: none; color: #ef4444; cursor: pointer;">✕</button>
          </div>
        </div>
      `).join('') : '<p class="empty">Click odds to add bets</p>';
      
      document.getElementById('bets').innerHTML = betsHtml;
      document.getElementById('selections').textContent = selectedBets.length;
      
      const totalOdds = selectedBets.reduce((a, b) => a * b.odds, 1).toFixed(2);
      document.getElementById('totalOdds').textContent = totalOdds;
    }

    function placeBet() {
      const stake = document.getElementById('stake').value;
      if (!stake || selectedBets.length === 0) {
        alert('Add bets and enter a stake');
        return;
      }
      const winnings = (stake * parseFloat(document.getElementById('totalOdds').textContent)).toFixed(2);
      alert(`✅ Bet placed!\nStake: $${stake}\nPotential win: $${winnings}`);
      selectedBets = [];
      document.getElementById('stake').value = '';
      updateSlip();
    }

    displayEvents();
  </script>
</body>
</html>
